<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">What leaves your tenant: online license check and offline entitlement</title>
  <desc id="desc">Two panels. Online license check: the Zenpo web parts in the browser read SharePoint Online as the signed-in user, and send license calls with the domain, product, web part and version to the Zenpo licensing service outside the tenant. No list or page content is sent. Offline entitlement on the Enterprise plan: the entitlement is inside the package, the web parts read SharePoint Online as the signed-in user, and nothing leaves the tenant. The Zenpo licensing service is not contacted.</desc>

  <defs>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="579" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="500" y1="24" x2="500" y2="530" stroke="#e5e7eb"/>

  <!-- Panel A: online license check -->
  <text x="40" y="44" font-size="20" font-weight="700" fill="#111827">Online license check</text>
  <text x="40" y="66" font-size="13" fill="#4b5563">Trial, Pilot, Essential, Standard, Scale, Enterprise online</text>

  <rect x="70" y="88" width="370" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="255" y="113" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Zenpo licensing service</text>
  <text x="255" y="133" font-size="13" fill="#4b5563" text-anchor="middle">Outside your tenant</text>

  <rect x="40" y="222" width="430" height="300" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="454" y="244" font-size="13" font-weight="700" fill="#15803d" text-anchor="end">Your Microsoft 365 tenant</text>

  <line x1="170" y1="150" x2="170" y2="256" stroke="#b45309" stroke-width="2" marker-start="url(#arrow-out)" marker-end="url(#arrow-out)"/>
  <text x="184" y="186" font-size="12" font-weight="700" fill="#92400e">domain, product, web part, version</text>
  <text x="184" y="203" font-size="12" fill="#92400e">No list or page content.</text>

  <rect x="70" y="258" width="370" height="78" rx="10" fill="#ffffff" stroke="#374151"/>
  <text x="255" y="284" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Zenpo web parts in the browser</text>
  <text x="255" y="304" font-size="13" fill="#4b5563" text-anchor="middle">Run as the signed-in user</text>
  <text x="255" y="323" font-size="13" fill="#4b5563" text-anchor="middle">License checked online</text>

  <line x1="255" y1="338" x2="255" y2="410" stroke="#374151" stroke-width="2" marker-start="url(#arrow-in)" marker-end="url(#arrow-in)"/>
  <text x="268" y="370" font-size="12" fill="#374151">SharePoint REST</text>
  <text x="268" y="386" font-size="12" fill="#374151">user's own permissions</text>

  <rect x="70" y="412" width="370" height="78" rx="10" fill="#ffffff" stroke="#374151"/>
  <text x="255" y="445" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">SharePoint Online</text>
  <text x="255" y="466" font-size="13" fill="#4b5563" text-anchor="middle">Your lists, libraries and pages</text>

  <!-- Panel B: offline entitlement -->
  <text x="530" y="44" font-size="20" font-weight="700" fill="#111827">Offline entitlement</text>
  <text x="530" y="66" font-size="13" fill="#4b5563">Enterprise plan</text>

  <rect x="560" y="88" width="370" height="60" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="745" y="113" font-size="15" font-weight="700" fill="#9ca3af" text-anchor="middle">Zenpo licensing service</text>
  <text x="745" y="133" font-size="13" fill="#9ca3af" text-anchor="middle">Not contacted</text>

  <rect x="530" y="222" width="430" height="300" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="944" y="244" font-size="13" font-weight="700" fill="#15803d" text-anchor="end">Your Microsoft 365 tenant</text>

  <line x1="660" y1="150" x2="660" y2="175" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="660" y1="201" x2="660" y2="256" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="660" cy="188" r="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="654" y1="182" x2="666" y2="194" stroke="#6b7280" stroke-width="2"/>
  <line x1="666" y1="182" x2="654" y2="194" stroke="#6b7280" stroke-width="2"/>
  <text x="684" y="186" font-size="12" font-weight="700" fill="#374151">No calls</text>
  <text x="684" y="203" font-size="12" fill="#374151">Nothing leaves your tenant.</text>

  <rect x="560" y="258" width="370" height="78" rx="10" fill="#ffffff" stroke="#374151"/>
  <text x="745" y="284" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Zenpo web parts in the browser</text>
  <text x="745" y="304" font-size="13" fill="#4b5563" text-anchor="middle">Run as the signed-in user</text>
  <text x="745" y="323" font-size="13" fill="#4b5563" text-anchor="middle">Entitlement inside the package</text>

  <line x1="745" y1="338" x2="745" y2="410" stroke="#374151" stroke-width="2" marker-start="url(#arrow-in)" marker-end="url(#arrow-in)"/>
  <text x="758" y="370" font-size="12" fill="#374151">SharePoint REST</text>
  <text x="758" y="386" font-size="12" fill="#374151">user's own permissions</text>

  <rect x="560" y="412" width="370" height="78" rx="10" fill="#ffffff" stroke="#374151"/>
  <text x="745" y="445" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">SharePoint Online</text>
  <text x="745" y="466" font-size="13" fill="#4b5563" text-anchor="middle">Your lists, libraries and pages</text>

  <!-- Footer -->
  <text x="500" y="558" font-size="13" fill="#374151" text-anchor="middle">Both: no Microsoft Graph, no API permissions, no admin consent. Your content never leaves SharePoint.</text>
</svg>
